[package]
name = "sefer"
version = "0.0.0"
description = "Sefer desktop host"
authors = ["Sefer contributors"]
edition = "2021"

# The `_lib` suffix is not redundant: on Windows a lib and a bin of the same
# name collide (rust-lang/cargo#8519). `main.rs` is a two-line shim over it.
[lib]
name = "sefer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Mirrors the v1 app: naming openssl with the `vendored` feature makes
# libgit2-sys link a built-from-source OpenSSL, which is what lets the Linux
# release build produce a portable AppImage/deb instead of depending on
# whatever libssl the runner happens to carry. On macOS and Windows git2 uses
# the platform TLS stack and this dependency is inert.
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
# The Git port's desktop half. `https` is the transport Gitea/WACS needs; ssh
# is deliberately absent because Sefer authenticates with a token, never a key.
git2 = { version = "0.20", features = ["https"] }

# The Scripture Kitchen engine, NATIVELY — the desktop half of the CorpusEngine
# port (src-tauri/src/corpus.rs). `parallel` is the whole reason it is here: it
# maps a publication's chapters on rayon's global pool, and the engine's own
# `tests/equivalence.rs` holds those published bytes against the serial map's.
#
# A PATH dependency to the sibling checkout, deliberately. The wasm artifact in
# `vendor/galley/` was built from that SAME working tree — revision
# 663403ac0f2bb2aa1b5dba9efd2601f35ffd28ac, recorded in
# `vendor/galley/manifest.json` — which is what makes "one engine, two doors"
# true rather than approximately true. The engine is not published yet; once it
# is pushed these two lines become:
#
#   usfm_galley = { git = "https://github.com/WycliffeAssociates/scripture-kitchen.git", rev = "663403ac0f2bb2aa1b5dba9efd2601f35ffd28ac", features = ["parallel"] }
#   sous-core   = { git = "https://github.com/WycliffeAssociates/scripture-kitchen.git", rev = "663403ac0f2bb2aa1b5dba9efd2601f35ffd28ac" }
#
# and the manifest revision stays the single source of that pin. Note the
# absent `wasm` feature: the native door links no wasm-bindgen.
usfm_galley = { path = "../../usfm_onion_2/galley", features = ["parallel"] }
# `Brigade` — the concrete `ChapterPass` the Expediter is parameterised over —
# lives in sous-core and galley does not re-export it, so it is named directly.
sous-core = { path = "../../usfm_onion_2/sous-chef/core" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# `keyring` selects its backing store at compile time, and the feature that
# names one store pulls that platform's dependencies (dbus on Linux). Enabling
# all three everywhere would break the macOS build, so each target names its
# own.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
debug = false
