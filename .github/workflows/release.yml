# Deploying Sefer.
#
# STUB, AND DELIBERATELY NOT ARMED. `push:` is commented out below: the
# hostnames in `wrangler.jsonc` are placeholders and there is no Sefer item in
# the 1Password vault, so arming it now would fail on every commit and train
# everybody to ignore a red X. `resolve` already handles the push cases, so
# arming it is uncommenting one block.
#
# Modelled on scripture-editor-proto-2's release.yml — same 1Password action,
# same wrangler invocation, same tag-resolves-the-channel shape.
#
# ## Three channels, and the asymmetry is the point
#
#   push to master   -> dev       web only, --mode dev, ~1 minute.
#                                 The one deployed thing carrying /design, the
#                                 comment panel and ?fixture=1. Fast because
#                                 iterating should not cost a desktop matrix.
#
#   dispatch / -rc   -> preview   A PROMOTION, not a consequence of pushing.
#                                 Full test suite, full desktop matrix. Nobody
#                                 ships a broken Preview; it is the last
#                                 rehearsal before a tag.
#
#   tag v*           -> production  Preview with the label changed.
#
# Building preview on every push would make it a second dev and leave nobody
# able to say "go test drive this". That is why the middle row is manual.
#
# The build mode and the wrangler environment have to agree, and that pairing
# lives in `tools/deploy/web.ts` rather than here, so CI and a laptop cannot
# disagree about which build carries the design surface.
#
# NOT HERE: the updater worker and the isomorphic-git proxy. Separate configs,
# separate hostnames, separate deploy steps — see planning/02-ready/.

name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish
        required: true
        type: choice
        options: [dev, preview, production]

  # TODO: arm once wrangler.jsonc has real hostnames and 1Password has a Sefer
  # item. `resolve` below already answers all three cases.
  #
  # push:
  #   branches: [master]
  #   tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.channel || 'auto' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
      desktop: ${{ steps.pick.outputs.desktop }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
          elif [[ "${{ github.ref }}" == refs/tags/v*-rc* ]]; then
            channel=preview
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            channel=production
          else
            channel=dev
          fi
          # Desktop is the expensive half. dev skips it on purpose; the other
          # two are release rehearsals and must not.
          if [ "$channel" = "dev" ]; then desktop=false; else desktop=true; fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop}" >> "$GITHUB_OUTPUT"
          echo "channel: ${channel} (desktop: ${desktop})" >> "$GITHUB_STEP_SUMMARY"

  # The same gate `pnpm check` runs locally, plus the browser project. Skipped
  # for dev: master already ran it on the push that produced this commit, and
  # paying for it twice is what makes people stop pushing.
  verify:
    needs: [resolve]
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:browser
      - name: The design surface is in dev and out of production
        run: pnpm verify:design

  deploy-web:
    needs: [resolve, verify]
    # `always()` so dev — which skips verify — still deploys, while a real
    # verify failure still stops preview and production.
    if: always() && needs.resolve.result == 'success' && needs.verify.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # TODO placeholder path. The old repo uses op://DevOps/Scripture-Editor;
      # Sefer needs its own item with these two fields before this resolves.
      - name: Source secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: "op://DevOps/Sefer/cloudflare-api-token"
          CLOUDFLARE_ACCOUNT_ID: "op://DevOps/Sefer/cloudflare-account-id"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds and deploys in one step on purpose: tools/deploy/web.ts owns the
      # mode-to-channel pairing, and splitting them here is exactly where that
      # pairing could quietly come apart.
      - name: Deploy
        run: pnpm deploy:web ${{ needs.resolve.outputs.channel }}

      - name: Summary
        run: |
          echo "web: ${{ needs.resolve.outputs.channel }} from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # TODO: not written yet. Needs, in order: the Tauri updater keypair
  # generated (`pnpm tauri signer generate`) and its public half in
  # tauri.conf.json, which today still holds REPLACE_WITH_MINISIGN_PUBLIC_KEY;
  # the Apple signing material in 1Password; and tools/tauri/patchVersion.ts
  # wired to the resolved channel. `SEFER_CHANNEL=preview` selects
  # src-tauri/tauri.conf.preview.json.
