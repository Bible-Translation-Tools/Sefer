# Deploying the web build to Cloudflare.
#
# STUB, AND DELIBERATELY NOT ARMED. The trigger is `workflow_dispatch` only:
# the hostnames in `wrangler.jsonc` are placeholders, and there is no Sefer
# entry in the 1Password vault yet, so a `push:` trigger would do nothing but
# fail on every commit and train everybody to ignore a red X. Add the triggers
# in the commented block below once both exist.
#
# Modelled on scripture-editor-proto-2's release.yml, which is the shape this
# organisation already runs — same channel resolution, same 1Password action,
# same wrangler invocation.
#
# Channels:
#
#   push to master   -> nightly  (the real application, no design surface)
#                    -> design   (the same commit, WITH /design — the designer's
#                                 prototype, which is why it is master rather
#                                 than a long-lived branch)
#   tag v*           -> production
#
# The build mode and the wrangler environment have to agree, and that pairing
# lives in `tools/deploy/web.ts` rather than here, so CI and a laptop cannot
# disagree about which build carries the design surface.

name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which Cloudflare environment to deploy
        required: true
        type: choice
        options: [nightly, design, production]

  # TODO: arm these once wrangler.jsonc has real hostnames and 1Password has a
  # Sefer entry. `compute-channel` below already resolves both cases.
  #
  # push:
  #   branches: [master]
  #   tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Kept even though the current trigger passes the environment directly: it is
  # what makes arming `push:` a one-line change rather than a rewrite.
  compute-channel:
    runs-on: ubuntu-24.04
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environments='["${{ inputs.environment }}"]'
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            environments='["production"]'
          else
            # One commit, two hostnames: the nightly build for people trying
            # the real thing, and the design build for the prototype.
            environments='["nightly","design"]'
          fi
          echo "environments=${environments}" >> "$GITHUB_OUTPUT"
          echo "deploying: ${environments}" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: [compute-channel]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Independent hostnames; one failing should not cancel the other.
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.compute-channel.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      # TODO placeholder path. The old editor uses op://DevOps/Scripture-Editor;
      # Sefer needs its own item before this resolves.
      - name: Source secrets
        id: secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: "op://DevOps/Sefer/cloudflare-api-token"
          CLOUDFLARE_ACCOUNT_ID: "op://DevOps/Sefer/cloudflare-account-id"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.4.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds and deploys in one step on purpose: `tools/deploy/web.ts` owns
      # the mode-to-environment pairing, and splitting them here would be the
      # place that pairing could quietly come apart.
      - name: Deploy
        run: pnpm deploy:web ${{ matrix.environment }}

      - name: Summary
        run: |
          echo "deployed ${{ matrix.environment }} from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
