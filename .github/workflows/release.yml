name: release

# Channel-aware desktop release.
#
#   push of a v* tag   -> Stable  (tag as given, not a prerelease)
#   nightly schedule   -> Nightly (prerelease, tagged nightly-<version>)
#   workflow_dispatch  -> Nightly, for a manual rerun
#
# Quality gates live in check.yml and are enforced by branch protection; this
# workflow does not re-run them.
#
# Modelled on the v1 app's release workflow, minus two things deliberately:
#
#   * Apple notarisation and Windows code signing. v1 sourced those certificates
#     from 1Password (`1password/load-secrets-action`). Sefer has no signing
#     identity of its own yet, so macOS builds are unsigned and Gatekeeper will
#     warn. Adding it later is a matter of restoring that step and setting
#     APPLE_SIGNING_IDENTITY / APPLE_API_* around the tauri-action step.
#
#   * The Cloudflare updater worker deploy. The worker that turns GitHub
#     releases into Tauri update manifests lives in the v1 repository at
#     `workers/zephyr-updater`, and Sefer needs its OWN instance with its own
#     R2/GitHub configuration before `SEFER_UPDATER_HOST` can point anywhere.
#     Until that exists, the updater artifacts and their .sig files are still
#     uploaded to the GitHub release below — a worker can be pointed at them
#     retroactively. See documentation/architecture/desktop.md.

on:
  push:
    tags: ["v*"]
  schedule:
    # 07:00 UTC daily. Nightly only; a tag push is the only path to Stable.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Resolved once so every matrix leg agrees on the tag, the version and which
  # config overlays to apply.
  channel:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel=stable
            tag="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
          else
            channel=nightly
            # A SINGLE numeric pre-release identifier, on purpose: Tauri's MSI
            # bundler rejects multi-identifier forms even when the first part is
            # numeric. github.run_number is monotonic and fits in 16 bits. The
            # date and commit are recoverable from the release itself.
            version="${base}-${GITHUB_RUN_NUMBER}"
            tag="nightly-${version}"
            prerelease=true
          fi
          {
            echo "channel=${channel}"
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "channel=${channel} tag=${tag} version=${version}"

  desktop:
    needs: channel
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - os: windows-latest
            target_args: ""
            rust_targets: ""
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
              src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.zip
              src-tauri/target/release/bundle/msi/*.msi.zip.sig
          - os: ubuntu-22.04
            target_args: ""
            rust_targets: ""
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    env:
      # Every URL the frontend talks to. Vite inlines these at build time; see
      # documentation/architecture/configuration.md. An unset secret becomes an
      # empty string, which `src/app/env.ts` reads as null — the feature then
      # says "not configured for this build" instead of guessing a host.
      VITE_SEFER_UPDATER_HOST: ${{ needs.channel.outputs.channel == 'stable' && secrets.SEFER_UPDATER_HOST_STABLE || secrets.SEFER_UPDATER_HOST_NIGHTLY }}
      VITE_SEFER_GITEA_WEB_HOST: ${{ secrets.SEFER_GITEA_WEB_HOST }}
      VITE_SEFER_GITEA_DESKTOP_HOST: ${{ secrets.SEFER_GITEA_DESKTOP_HOST }}
      VITE_SEFER_GIT_CORS_PROXY_URL: ${{ secrets.SEFER_GIT_CORS_PROXY_URL }}
      VITE_SEFER_GIT_PROXY_X_REQUESTED_WITH: ${{ secrets.SEFER_GIT_PROXY_X_REQUESTED_WITH }}
      VITE_SEFER_LANGUAGE_API_URL: ${{ secrets.SEFER_LANGUAGE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      # src-tauri/Cargo.toml pins the native engine by PATH to a sibling checkout
      # (../scripture-kitchen), the same working tree vendor/galley was built from.
      # Two prerequisites before this step works: the revision in
      # vendor/galley/manifest.json must be pushed to scripture-kitchen, and
      # SEFER_KITCHEN_TOKEN must read that private repository. Once pushed, the
      # cleaner end state is a `git = …, rev = …` dependency and no step here.
      - name: Check out the engine beside the workspace
        env:
          KITCHEN_TOKEN: ${{ secrets.SEFER_KITCHEN_TOKEN }}
        run: |
          set -euo pipefail
          rev=$(node -p "require('./vendor/galley/manifest.json').engine.revision")
          git clone --no-checkout "https://x-access-token:${KITCHEN_TOKEN}@github.com/WycliffeAssociates/scripture-kitchen.git" "${{ github.workspace }}/../scripture-kitchen"
          git -C "${{ github.workspace }}/../scripture-kitchen" checkout --quiet "$rev"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0-rc.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      # The release's version, stamped into all three manifests. The in-tree
      # value stays 0.0.0 so no commit exists only to bump it.
      - name: Stamp version
        run: node tools/tauri/patchVersion.ts "${{ needs.channel.outputs.version }}"

      # tauri.conf.json cannot read the environment, so the updater endpoint
      # arrives as a generated config overlay. No host configured means no
      # endpoints and a build whose updater honestly reports "not configured".
      - name: Generate updater config
        shell: bash
        env:
          SEFER_UPDATER_HOST: ${{ needs.channel.outputs.channel == 'stable' && secrets.SEFER_UPDATER_HOST_STABLE || secrets.SEFER_UPDATER_HOST_NIGHTLY }}
          SEFER_CHANNEL: ${{ needs.channel.outputs.channel }}
        run: node tools/tauri/updaterConfig.ts

      - name: Resolve config args
        id: config
        shell: bash
        run: |
          set -euo pipefail
          args="--config src-tauri/gen/tauri.conf.env.json"
          if [[ "${{ needs.channel.outputs.channel }}" == "nightly" ]]; then
            args="${args} --config src-tauri/tauri.conf.nightly.json"
          fi
          echo "args=${args}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri-action runs `beforeBuildCommand` (`pnpm build`) itself, so the
      # frontend is built here with the VITE_SEFER_* values above in scope.
      #
      # TAURI_SIGNING_PRIVATE_KEY is the minisign key whose PUBLIC half is
      # pinned in tauri.conf.json. Without it `createUpdaterArtifacts` fails —
      # correctly: an unsigned update is an update nobody should install.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.channel.outputs.tag }}
          releaseName: ${{ needs.channel.outputs.tag }}
          releaseDraft: false
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
          args: ${{ matrix.target_args }} ${{ steps.config.outputs.args }} --ci

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ needs.channel.outputs.tag }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
