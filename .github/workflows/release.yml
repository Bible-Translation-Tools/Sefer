# Deploying Sefer.
#
# ARMED. A push to master deploys `dev`; a `v*` tag releases.
#
# The wrangler configs currently have their custom-domain routes COMMENTED OUT,
# so every channel lands on its `*.workers.dev` subdomain. That is deliberate
# for now: it means a push actually deploys something today rather than failing
# on a route for a hostname nobody has registered. Uncomment the routes in
# `wrangler.jsonc` and `workers/sefer-updater/wrangler.toml` when DNS exists.
#
# Modelled on scripture-editor-proto-2's release.yml — same 1Password action,
# same wrangler invocation, same tag-resolves-the-channel shape.
#
# ## Three channels, and the asymmetry is the point
#
#   push to master   -> dev       web only, --mode dev, ~1 minute.
#                                 The one deployed thing carrying /design, the
#                                 comment panel and ?fixture=1. Fast because
#                                 iterating should not cost a desktop matrix.
#
#   dispatch / v0.3.0-1 -> preview  A PROMOTION, not a consequence of pushing.
#                                 Full test suite, full desktop matrix. Nobody
#                                 ships a broken Preview; it is the last
#                                 rehearsal before a tag.
#
#   tag v*           -> production  Preview with the label changed.
#
# Building preview on every push would make it a second dev and leave nobody
# able to say "go test drive this". That is why the middle row is manual.
#
# The build mode and the wrangler environment have to agree, and that pairing
# lives in `tools/deploy/web.ts` rather than here, so CI and a laptop cannot
# disagree about which build carries the design surface.
#
# The updater worker deploys from `deploy-updater` below, on the two desktop
# channels only. NOT here: the browser git proxy — it is
# ../wacs-isomorphic-git-proxy, shared by every WACS client, and not Sefer's
# to own. See documentation/architecture/configuration.md.

name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish
        required: true
        type: choice
        options: [dev, preview, production]
      version:
        description: >-
          Version to stamp, e.g. 0.3.0 or 0.3.0-1. Required for a desktop
          build; leave empty to deploy web only. A pre-release must be a single
          numeric identifier — Tauri's MSI bundler rejects anything else.
        required: false
        type: string

  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.channel || 'auto' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
      # "Is this a rehearsal for shipping?" Decided ONCE, here, rather than
      # re-derived as `channel != 'dev'` at each step that wants to know —
      # which is how one of them ends up spelled differently from the rest.
      full: ${{ steps.pick.outputs.full }}
      desktop: ${{ steps.pick.outputs.desktop }}
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          version=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v*-* ]]; then
            channel=preview
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            channel=production
            version="${GITHUB_REF_NAME#v}"
          else
            channel=dev
          fi

          # Desktop is the expensive half, and it needs a version to stamp into
          # the bundle. dev never builds it; the other two build it when they
          # know what to call it, which a tag always does and a dispatch only
          # does if somebody typed one.
          if [ "$channel" = "dev" ] || [ -z "$version" ]; then
            desktop=false
          else
            desktop=true
          fi

          # A pre-release is a candidate: 0.3.0-1. One numeric identifier,
          # because Tauri's MSI bundler rejects anything else.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi

          # preview and production are rehearsals for shipping and pay the full
          # gate. dev is not, and pays the cheap half. Preview is deliberately
          # on the expensive side of this line: it is the last rehearsal before
          # a tag, so it must not be a second dev.
          if [ "$channel" = "dev" ]; then full=false; else full=true; fi

          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "desktop=${desktop}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          {
            echo "channel: ${channel}"
            echo "desktop: ${desktop}${version:+ (v${version}, prerelease=${prerelease})}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs for EVERY channel, and it is now the ONLY gate on master: `check.yml`
  # no longer fires there, because it was running the same six commands as
  # `pnpm check` below, twice and concurrently, on every push to the trunk.
  #
  # What dev skips is the pair that needs a full second BUILD — end-to-end
  # serves `dist/` through `vite preview`, and `verify:design` builds twice to
  # prove the surface is in one and out of the other. Those are rehearsals for
  # shipping, and dev is not shipping.
  #
  # What dev does NOT skip is the browser project, which only needs a Chromium
  # download. `check.yml` used to supply that on master as a side effect of
  # running there at all, so dropping it here would have cost the one channel
  # that deploys on every push its only real-browser coverage — an invisible
  # loss, which is the worst kind.
  verify:
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # typecheck, lint, format, boundaries, unit tests, build.
      - run: pnpm check

      # Unused files, exports, types and dependencies, and import cycles — all
      # at zero since 2026-09-23 and cheap to keep there. Something built ahead
      # of its screen says so with a `fallow-ignore` naming what it waits for.
      # Here and not in `pnpm check`, so a feature branch can carry a
      # half-wired file.
      - run: pnpm deadcode

      # Every channel, dev included. `check.yml` used to provide this on master
      # as a side effect of running there at all; it no longer runs on master,
      # so skipping it here would have quietly dropped browser coverage from
      # the one channel that deploys on every push. It is four files and about
      # half a minute — far too cheap to be the thing that makes dev fast.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser project
        run: pnpm test:browser

      # The rehearsal half, in ONE gated step rather than a condition repeated
      # per command. Both of these need a second full BUILD — end-to-end serves
      # `dist/` through `vite preview`, and `verify:design` builds twice to
      # prove the surface is in one and out of the other — which is the whole
      # reason dev does not pay for them.
      #
      # `pnpm test:e2e` is the only check anywhere that would notice a bundle
      # passing every other gate and then failing to boot.
      - name: Rehearsal checks (preview and production)
        if: needs.resolve.outputs.full == 'true'
        run: |
          set -euo pipefail
          pnpm test:e2e
          pnpm verify:design

      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-traces-${{ needs.resolve.outputs.channel }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  deploy-web:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Source secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: "op://DevOps/Sefer/cloudflare-api-token"
          CLOUDFLARE_ACCOUNT_ID: "op://DevOps/Sefer/cloudflare-account-id"

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds and deploys in one step on purpose: tools/deploy/web.ts owns the
      # mode-to-channel pairing, and splitting them here is exactly where that
      # pairing could quietly come apart.
      - name: Deploy
        run: pnpm deploy:web ${{ needs.resolve.outputs.channel }}

      - name: Summary
        run: |
          echo "web: ${{ needs.resolve.outputs.channel }} from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # A separate job, not a step of deploy-web: different deployable, different
  # hostname, different failure mode. Only the two desktop channels — `dev` is
  # web-only and has nothing to auto-update.
  #
  # `tools/deploy/updater.ts` passes --config explicitly, which is what stops
  # wrangler falling back to the root wrangler.jsonc and redeploying the SPA
  # instead. It also pushes GH_TOKEN as a Worker secret on every deploy, so
  # rotating the token is a 1Password edit rather than a hunt.
  deploy-updater:
    needs: [resolve, verify]
    if: needs.resolve.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Source secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: "op://DevOps/Sefer/cloudflare-api-token"
          CLOUDFLARE_ACCOUNT_ID: "op://DevOps/Sefer/cloudflare-account-id"
          UPDATER_GH_TOKEN: "op://DevOps/Sefer/updater-gh-token"

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy updater
        run: pnpm deploy:updater ${{ needs.resolve.outputs.channel }}

      - name: Summary
        run: |
          echo "updater: ${{ needs.resolve.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"

  # The expensive half: three operating systems, Rust, code signing and
  # notarisation. Only runs when there is a version to stamp — a tag always
  # has one, a dispatch only if somebody typed it. `dev` never gets here.
  #
  # tauri-action creates or updates the GitHub Release and attaches the
  # bundles plus their .sig files. Those assets ARE the updater's backing
  # store: `workers/sefer-updater` reads this release through the GitHub API
  # and inlines the .sig contents into the manifest it serves. Until a release
  # exists with them, the updater correctly answers 404.
  build-desktop:
    needs: [resolve, verify]
    if: needs.resolve.outputs.desktop == 'true'
    permissions:
      contents: write
    strategy:
      # Independent platforms; one failing should not cancel the others, and
      # a partial release is easier to reason about than none.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: ""
            bundles: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - os: ubuntu-22.04
            args: ""
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Source secrets
        id: secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_CERTIFICATE: "op://DevOps/Sefer/p12-b64"
          APPLE_CERTIFICATE_PASSWORD: "op://DevOps/Sefer/apple-p12-cert-password"
          KEYCHAIN_PASSWORD: "op://DevOps/Sefer/keychain-password"
          APP_STORE_CONNECT_KEY: "op://DevOps/Sefer/app-store-connect-p8-b64"
          APP_STORE_API_ISSUER: "op://DevOps/Sefer/app-store-connect-api-issuer"
          APP_STORE_API_KEY_ID: "op://DevOps/Sefer/app-store-connect-api-key-id"
          TAURI_SIGNING_PRIVATE_KEY: "op://DevOps/Sefer/tauri-updater-private-key"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "op://DevOps/Sefer/tauri-updater-private-key-password"
          UPDATER_HOST_PREVIEW: "op://DevOps/Sefer/updater-host-preview"
          UPDATER_HOST_PRODUCTION: "op://DevOps/Sefer/updater-host-production"

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Stamps package.json, tauri.conf.json and Cargo.toml. The in-tree value
      # stays 0.0.0; this is what makes the built binary report the version the
      # updater will compare against.
      - name: Stamp the version
        run: node tools/tauri/patchVersion.ts "${{ needs.resolve.outputs.version }}"

      # Writes src-tauri/gen/tauri.conf.env.json with the updater endpoint.
      # tauri-action does not go through tools/tauri/run.ts, so the overlay is
      # written here and passed explicitly below.
      - name: Write the updater endpoint overlay
        shell: bash
        env:
          SEFER_UPDATER_HOST: ${{ needs.resolve.outputs.channel == 'production' && steps.secrets.outputs.UPDATER_HOST_PRODUCTION || steps.secrets.outputs.UPDATER_HOST_PREVIEW }}
        run: |
          set -euo pipefail
          # Empty means the built binary checks nothing and says "not
          # configured" forever, with no error to notice. Fail loudly instead.
          test -n "$SEFER_UPDATER_HOST"
          node tools/tauri/updaterConfig.ts

      # tauri-action builds the frontend itself, so it needs the same endpoint
      # variables `pnpm deploy:web` sets — and from the same table, so the two
      # cannot end up pointed at different content hosts for one channel.
      - name: Endpoints for this channel
        shell: bash
        run: node tools/deploy/channelEnv.ts "${{ needs.resolve.outputs.channel }}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # --- macOS signing -----------------------------------------------------
      # Signing and notarisation only. The keychain is created fresh on a
      # throwaway runner, so its password is a formality rather than a secret
      # worth protecting — it is in 1Password because the old repo put it there.

      - name: Decode the App Store Connect key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APP_STORE_CONNECT_KEY: ${{ steps.secrets.outputs.APP_STORE_CONNECT_KEY }}
        run: |
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > app-store-connect.p8
          echo "APPLE_API_KEY_PATH=$(pwd)/app-store-connect.p8" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ steps.secrets.outputs.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.secrets.outputs.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ steps.secrets.outputs.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Find the signing identity
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          test -n "$CERT_ID"
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"

      # --- build -------------------------------------------------------------

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_API_ISSUER: ${{ steps.secrets.outputs.APP_STORE_API_ISSUER }}
          APPLE_API_KEY: ${{ steps.secrets.outputs.APP_STORE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.secrets.outputs.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.secrets.outputs.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: ${{ needs.resolve.outputs.tag }}
          releaseDraft: false
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          # The env overlay carries the updater endpoint; the preview overlay
          # carries the product name and identifier. Both are --config on top
          # of tauri.conf.json, which is what tools/tauri/run.ts does locally.
          args: >-
            ${{ matrix.args }}
            --config src-tauri/gen/tauri.conf.env.json
            ${{ needs.resolve.outputs.channel == 'preview' && '--config src-tauri/tauri.conf.preview.json' || '' }}
            --verbose --ci

      - name: Keep the bundles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-${{ needs.resolve.outputs.channel }}
          path: ${{ matrix.bundles }}
          if-no-files-found: warn
