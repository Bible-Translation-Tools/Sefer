name: check

on:
  # Every branch EXCEPT master. A push to master already runs `release.yml`,
  # whose `verify` job is `pnpm check` plus the promotion-only extras and gates
  # every deploy — so running this one there as well meant the same six
  # commands ran twice, concurrently, on every push to the trunk.
  #
  # The gate on master is therefore `verify`, not this. This workflow covers
  # what a release never reaches: feature branches, and pull requests.
  push:
    branches-ignore: [master]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm

      - name: Install
        run: |
          set -euo pipefail
          start=$SECONDS
          pnpm install --frozen-lockfile
          echo "install ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Repository checks
        run: |
          set -euo pipefail
          {
            echo "| step | seconds |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for step in typecheck lint format:check boundaries test:unit build; do
            start=$SECONDS
            pnpm run "$step"
            echo "| $step | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
          done

  # A URL for this branch, so "go look at this" does not mean "push to master".
  #
  # This is a CloudflarePreview — `wrangler versions upload` publishes a new
  # VERSION of the sefer-web-dev Worker and changes nothing about what
  # sefer-dev.bttdev.org serves. It is NOT the preview CHANNEL, which is a
  # promotion with the full desktop matrix behind it. See
  # documentation/glossary.md, "Deployment names".
  #
  # Needs `repository` to have passed: a URL for a branch that does not
  # typecheck is a URL that wastes somebody's afternoon.
  #
  # Skipped when the secret is absent, which is what a pull request from a FORK
  # looks like — GitHub withholds secrets there, and a job that failed for that
  # reason would be a red tick nobody can act on.
  preview:
    needs: [repository]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # At JOB level, not on the step: a step's `if` cannot read its own `env:`
    # block, so guarding the 1Password step on a token declared inside it would
    # have been a condition that is always false.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Source secrets
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: "op://DevOps/Sefer/cloudflare-api-token"
          CLOUDFLARE_ACCOUNT_ID: "op://DevOps/Sefer/cloudflare-account-id"

      - name: Upload a version for this branch
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          pnpm branch:preview "${GITHUB_REF_NAME}" | tee upload.log

          # Read wrangler's own LABELLED lines rather than pattern-matching a
          # hostname. The first attempt grepped `https://[a-z0-9-]+\.workers\.dev`
          # and matched nothing, because the host has several labels
          # (`<alias>-sefer-web-dev.<account>.workers.dev`) — and a grep that
          # matches nothing exits 1, which under `set -e` failed the step after
          # a PERFECTLY SUCCESSFUL upload. `sed -n …p` prints nothing and exits
          # 0, so a future change to wrangler's output costs a blank line here
          # rather than a red tick.
          alias_url=$(sed -n 's/.*Version Preview Alias URL: *//p' upload.log | tail -1)
          version_url=$(sed -n 's/.*Version Preview URL: *//p' upload.log | tail -1)
          # The alias first: it is stable across pushes, so the link in a pull
          # request keeps working as the branch moves. The version URL carries a
          # content hash and names one upload forever, which is the right
          # fallback and the wrong thing to send somebody.
          url="${alias_url:-${version_url}}"

          {
            echo "### Branch preview"
            echo ""
            if [ -n "$url" ]; then
              echo "$url"
            else
              echo "Uploaded, but no URL line was found in the wrangler output — see the log."
            fi
            echo ""
            echo "A CloudflarePreview of \`${GITHUB_REF_NAME}\`, built \`--mode dev\`, so it"
            echo "carries \`/design\`, the comment panel and \`?fixture=1\`."
            echo ""
            echo "This uploaded a VERSION and deployed nothing:"
            echo "\`sefer-dev.bttdev.org\` still serves whatever \`master\` last deployed."
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.4.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: |
          set -euo pipefail
          start=$SECONDS
          pnpm exec playwright install --with-deps chromium
          echo "chromium install $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Browser tests
        run: |
          set -euo pipefail
          start=$SECONDS
          pnpm test:browser
          echo "test:browser $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
