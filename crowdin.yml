# Read by Crowdin's GitHub integration (the WA organization's Sefer project), which supplies the
# project and the credentials itself. English is written here, in code review; Crowdin only
# translates it. Both catalogs are ICU MessageFormat JSON; see documentation/architecture/i18n.md.
preserve_hierarchy: true
# Crowdin's two-letter code for Brazilian Portuguese is "pt"; Sefer's locale tag is pt-BR.
languages_mapping:
  two_letters_code:
    pt-BR: pt-BR
commit_message: "Translations from Crowdin: %language%"
# A string nobody has translated yet is left out, not filled with English: Paraglide and the Sous
# words fall back to English by themselves, and English in es.json would come back to Crowdin as if
# it were Spanish.
skip_untranslated_strings: true
files:
  # The interface: Paraglide's catalogs, one flat file per language.
  - source: /src/app/messages/en.json
    translation: /src/app/messages/%two_letters_code%.json
  # Sous findings, worded by Sefer from kitchen's stable ids; nested { headline, details }.
  - source: /src/app/messages/sous/en.json
    translation: /src/app/messages/sous/%two_letters_code%.json
