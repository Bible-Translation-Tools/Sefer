# The app is the root package. `workers/*` are the additional things this
# repository DEPLOYS but that are not the app — the Tauri updater today, and
# whatever support services follow (a comment store on D1, say). A workspace
# rather than nested installs, so one `pnpm install` covers everything and
# wrangler can resolve a worker's dependencies when it is deployed with
# `--config` from the repository root.
packages:
  - "workers/*"

allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  workerd: true
# pnpm settings for this project (honored even for a single-package project —
# this file marks the workspace root). The Solid packages release in lockstep
# and templates track them closely; exclude the whole family from any
# minimumReleaseAge policy so fresh Solid releases install immediately.
#
# NOTE: this exclusion is a temporary measure for the Solid 2.0 prerelease
# cycle (frequent lockstep releases where new floors would otherwise fail
# under an age policy). It should be removed once Solid 2.0 is stable —
# at that point a caret range nearly always contains an age-satisfying
# release and the policy can protect these packages like any other.
minimumReleaseAgeExclude:
  - solid-js
  - '@solidjs/*'
  - lucide-solid@1.46.0

# corvu-next pins its Solid peers to an exact beta (2.0.0-beta.19) and
# lucide-solid still declares Solid 1 (^1.4.7). Both resolve against the one
# installed solid-js/@solidjs/web — pnpm's store shows a single copy of each —
# so the range is the only thing that disagrees. Declaring it here keeps the
# install clean instead of teaching everyone to ignore a peer warning.
#
# lucide-solid is Solid 1 in more than its peer range; `tools/vite/lucideSolid.ts`
# is what actually makes it run.
peerDependencyRules:
  allowedVersions:
    "@corvu-next/dialog>solid-js": "2.0.0-rc.6"
    "@corvu-next/dialog>@solidjs/web": "2.0.0-rc.6"
    "@corvu-next/popover>solid-js": "2.0.0-rc.6"
    "@corvu-next/popover>@solidjs/web": "2.0.0-rc.6"
    "@corvu-next/resizable>solid-js": "2.0.0-rc.6"
    "@corvu-next/resizable>@solidjs/web": "2.0.0-rc.6"
    "@corvu-next/tooltip>solid-js": "2.0.0-rc.6"
    "@corvu-next/tooltip>@solidjs/web": "2.0.0-rc.6"
    "lucide-solid>solid-js": "2.0.0-rc.6"
